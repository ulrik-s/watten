# cargo-deny — supply-chain, advisory and license policy.
# Run locally with `cargo deny check`. Schema: cargo-deny v2 (>= 0.16).

[advisories]
# RUSTSEC advisory database. Unfixed vulnerabilities and yanked crates
# fail the build by default in the v2 schema; list IDs here to waive.
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
# SPDX expressions accepted for every crate in the dependency graph.
confidence-threshold = 0.8
# Our own crate is `publish = false` and carries no license field — skip it.
private = { ignore = true }
# Keep a forward-looking allow-list without warning about entries that the
# current dependency tree happens not to use.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
# Duplicate dependency versions are common in transitive trees — warn
# rather than fail. Wildcard (`*`) version requirements are banned.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
